<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PagePulse - Production URL Audit Service</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      flex: 1;
    }
    h1 { color: var(--accent); }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      margin-top: 20px;
    }
    .form-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background-color: #090d16;
      color: #fff;
    }
    button {
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background-color: var(--accent-hover); }
    pre {
      background-color: #090d16;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      color: #a5f3fc;
    }
    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid var(--border-color);
      font-size: 0.9rem;
      color: #94a3b8;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>PagePulse Audit Dashboard</h1>
    <p>Run production-grade real-time URL performance, SEO, and security audits.</p>
    
    <div class="card">
      <div class="form-group">
        <input type="text" id="urlInput" placeholder="https://example.com" value="https://digitalheroesco.com" />
        <button onclick="runAudit()">Run Audit</button>
      </div>
      <div id="loading" style="display: none;">Auditing website, please wait...</div>
      <div id="resultContainer" style="display: none;">
        <h3>Audit Report</h3>
        <pre id="jsonResult"></pre>
      </div>
    </div>
  </div>

  <footer>
    <p>Built for Digital Heroes Training Task | <a href="https://digitalheroesco.com" target="_blank" rel="noopener noreferrer">digitalheroesco.com</a></p>
  </footer>

  <script>
    async function runAudit() {
      const url = document.getElementById('urlInput').value;
      const loading = document.getElementById('loading');
      const resultContainer = document.getElementById('resultContainer');
      const jsonResult = document.getElementById('jsonResult');

      if (!url) return alert('Please enter a valid URL');

      loading.style.display = 'block';
      resultContainer.style.display = 'none';

      try {
        const res = await fetch(`/api/v1/audit?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        jsonResult.textContent = JSON.stringify(data, null, 2);
        resultContainer.style.display = 'block';
      } catch (err) {
        alert('Failed to connect to audit API');
      } finally {
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>

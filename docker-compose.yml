version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - REDIS_URL=redis://cache:6379
      - CACHE_TTL_SECONDS=300
      - MAX_CONCURRENT_AUDITS=10
    depends_on:
      - cache

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"